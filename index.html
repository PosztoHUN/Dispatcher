<!doctype html><html lang="en"><head>
<!-- Budapest Tram Dispatcher: single-file game (HTML + CSS + JS). Bilingual (English / Hungarian); the language is chosen on every launch. --><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Budapest Tram Dispatcher</title><style>
:root{--bg:#e9edf0;--card:#fff;--fg:#14202b;--mut:#5b6b78;--bd:#c9d3da;--yel:#ffc20e;--pur:#7b2d8e;--red:#d6332f;--grn:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--card:#1a242d;--fg:#e8eef2;--mut:#93a3af;--bd:#2c3b47;--pur:#c07ad3;--grn:#3ccf7d;--red:#ff6a64}}
:root[data-theme="dark"]{--bg:#10171d;--card:#1a242d;--fg:#e8eef2;--mut:#93a3af;--bd:#2c3b47;--pur:#c07ad3;--grn:#3ccf7d;--red:#ff6a64}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 Bahnschrift,"DIN Alternate","Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:20px;margin:0;flex:1}
button{font:inherit;color:inherit;border:1.5px solid var(--bd);background:var(--card);border-radius:6px;padding:7px 12px;cursor:pointer}
button:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stats div{background:var(--card);border:1.5px solid var(--bd);border-radius:6px;padding:6px 10px}
.stats small{display:block;color:var(--mut);font-size:12px}.stats b{font-size:20px}
.panel{background:var(--card);border:1.5px solid var(--bd);border-radius:6px;padding:10px;margin-bottom:10px}
.panel h2{font-size:15px;margin:0 0 6px}
svg{width:100%;max-width:400px;height:auto;display:block;margin:0 auto;border:1.5px solid var(--bd);border-radius:4px}
.note{color:var(--mut);font-size:12px;margin:4px 0 0}.note a{color:var(--pur)}
.q{display:flex;gap:6px;flex-wrap:wrap;min-height:46px}
.tram{display:flex;align-items:center;gap:8px;text-align:left;padding:6px 10px;border-radius:6px;border:1.5px solid var(--fg);background:var(--yel);color:#14202b}
.tram b.ln{background:#14202b;color:var(--yel);border-radius:4px;padding:0 6px}
.tram small{display:block;font-size:11px}
.tram.sel{outline:3px solid var(--pur);outline-offset:2px}
.trk{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 10px;margin-bottom:6px;border-radius:6px;border:2px dashed var(--mut);cursor:pointer;user-select:none}
.trk.occ{border-style:solid;border-color:var(--fg);background:var(--yel);color:#14202b}
.trk.rdy{animation:bl 1s steps(2) infinite;border-color:var(--grn)}
@keyframes bl{50%{background:#fff3b0}}
@media (prefers-reduced-motion:reduce){.trk.rdy{animation:none;outline:3px solid var(--grn)}}
.trk .nm{font-weight:700;min-width:64px}
.bar{height:6px;background:rgba(0,0,0,.2);border-radius:3px;flex:1;min-width:60px;overflow:hidden}.bar i{display:block;height:100%;background:#14202b}
.log{font-size:13px;color:var(--mut);min-height:60px}.log div:first-child{color:var(--fg)}
#ov{position:fixed;inset:0;background:rgba(10,16,22,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5;overflow:auto}
#ov .box{background:var(--card);border-radius:10px;max-width:500px;width:100%;padding:18px;border:2px solid var(--yel)}
#ov h2{margin:0 0 6px;font-size:22px}#ov p{margin:6px 0}
#ov .jobs{display:grid;gap:8px;margin-top:10px}
#ov .jobs button{text-align:left;padding:10px 12px}#ov .jobs small{display:block;color:var(--mut)}
#lp{position:fixed;inset:0;background:rgba(10,16,22,.92);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#lp .box{background:var(--card);border-radius:10px;max-width:420px;width:100%;padding:18px;border:2px solid var(--yel);text-align:center}
#lp button{display:block;width:100%;margin:10px 0 0;padding:14px;font-size:18px;font-weight:700}
/* #lp = language picker overlay shown on every launch */
/* WIDE-SCREEN LAYOUT (16:9 monitors): two columns. Left = sticky map filling the window height; right = events, signal queues, tracks and log. */
@media (min-width:1000px) and (min-aspect-ratio:4/3){
 main{max-width:1800px;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);column-gap:12px;align-items:start}
 main>header,main>.stats{grid-column:1/-1}
 #mp{grid-column:1;grid-row:3/span 3;position:sticky;top:8px}
 #evp,#gp,#lg{grid-column:2}
 #mp svg{max-width:none!important;width:100%;height:calc(100vh - 210px);max-height:calc(100vh - 210px)}
}
</style></head><body><main>
<header><h1>Tram Dispatcher</h1><button id="lb">Language / Nyelv</button><button id="hb">Maps</button><button id="sp">Speed 1×</button><button id="pb">Pause</button><button id="mb">Date &amp; time</button></header>
<div class="stats"><div><small>Time</small><b id="sc">--:--</b></div><div><small>Score</small><b id="ss">0</b></div><div><small>Complaints</small><b id="st">0/3</b></div><div><small>Departed</small><b id="sd">0</b></div></div>
<div class="panel" id="mp"><h2 id="mh"></h2>
<svg id="map" viewBox="0 0 622 888" role="img"><image id="bg" href=""/><g id="ly"></g><g id="tg"></g></svg>
<p class="note" id="mn"></p><p class="note" id="jn"></p></div>
<div id="evp"></div>
<div id="gp"></div>
<div class="panel log" id="lg"></div>
</main><div id="ov"></div>
<!-- Language picker: shown first, the game code is only started after a choice -->
<div id="lp"><div class="box"><h2>Budapest Tram Dispatcher</h2><p>Choose your language<br>Válaszd ki a nyelvet</p><button data-l="en">English</button><button data-l="hu">Magyar</button></div></div>

const HU={"Driver training only (Tanulójárat). Never used in regular passenger service.": "Csak vezetőtanulói járat (Tanulójárat). Rendes utasforgalomban soha nem közlekedik.", "Heritage line N2, weekends from May to October. Can also be used as a driver trainer.": "N2 nosztalgia vonal, május–októberben hétvégenként. Vezetőtanulói járatként is használható.", "car 7671": "kocsi 7671", "car ": "kocsi ", "Lines 2 and 24 · 3 tracks · one signal": "Vonalak: 2 és 24 · 3 vágány · egy jelző", "Közvágóhíd H terminus · lines 2 and 24": "Közvágóhíd H végállomás · 2-es és 24-es vonal", "Map data © OpenStreetMap contributors, shown via OpenRailwayMap (pink = tram). Trams arrive from Boráros tér at the top left on the left-hand track and leave on the right-hand one. Timetable: BKK GTFS feed valid from 14 Nov 2026.": "Térképadatok © OpenStreetMap-közreműködők, az OpenRailwayMap segítségével megjelenítve (rózsaszín = villamos). A villamosok a Boráros tér felől érkeznek bal felül, a bal oldali vágányon, és a jobb oldalin távoznak. Menetrend: BKK GTFS-adatok, érvényes 2026. november 14-től.", "Map data © OpenStreetMap contributors, shown via OpenRailwayMap (pink = tram). Trams keep to the right-hand track. Lines 4 and 6 run both ways at the top: trams from Nyugati-pályaudvar M use track 10 (upper), trams from Buda over Margit híd use track 11 (lower). Lines 2, 2B and 23 arrive from Balassi Bálint utca at the bottom and leave the same way.": "Térképadatok © OpenStreetMap-közreműködők, az OpenRailwayMap segítségével megjelenítve (rózsaszín = villamos). A villamosok a jobb oldali vágányt használják. A 4-es és 6-os vonal fent mindkét irányban közlekedik: a Nyugati-pályaudvar M felől érkezők a 10-es (felső), a Margit híd felől érkező budai villamosok a 11-es (alsó) vágányt használják. A 2-es, 2B és 23-as vonal alul a Balassi Bálint utca felől érkezik, és ugyanarra indul vissza.", "Signal: trams waiting to enter (max 3)": "Jelző: belépésre váró villamosok (legfeljebb 3)", "Tap a waiting tr const IM=()=>M.id==='jmt'?IMP:M.id==='ker'?IMPR:IMPK,STR=()=>M.id==='jmt'?STREAMS:M.id==='ker'?RSTREAMS:KSTREAMS,KEY=()=>M.id==='jmt'?'tt_jmt':M.id==='ker'?'tt_ker':'tt_kvh',TTL=x=>M.id==='jmt'?TTN[x[3]]:_t('Line ')+x[0];
function dayNote(d){const k=dayOf(d),lab={mon:_t('Weekday'),sat:_t('Saturday'),sun:_t('Sunday')}[k];
 const im=STR().filter(x=>(IM()[k]||{})[x[3]]&&IM()[k][x[3]].length).map(x=>x[3]);
 if(M.id==='kvh')return lab+': '+(k==='sun'?_t('no Sunday timetable built in, so Saturday is used. '):'')+(im.length?_t('real times imported for line ')+im.join(', ')+_t('; the rest comes from the built-in BKK GTFS data.'):_t('built-in BKK GTFS timetable.'));
 return lab+': '+(im.length?_t('real times imported for ')+im.join(', ')+_t('; the other streams are simulated.'):_t('no real times imported yet, so every stream is simulated.'))}
function goShift(){const d=$('dd').value,t=$('dt').value,l=+$('dl').value;if(!d||!t)return;const[h,m]=t.split(':').map(Number);start({date:d,day:dayOf(d),from:h*3600+m*60,len:l})}
let TTD='mon';
function ttCollect(){const o={};for(const x of STR()){const t=$('tt'+x[3]).value;o[x[3]]=[...t.matchAll(/(\d{1,2}):(\d{2})/g)].map(m=>+m[1]*3600+ +m[2]*60).sort((a,b)=>a-b)}IM()[TTD]=o}
function ttScreen(d){if(d)TTD=d;
 let h=_t('<div class="box" style="max-height:85vh;overflow:auto"><h2>Timetable import</h2><div class="jobs">')+[['mon',_t('Weekday')],['sat',_t('Saturday')],['sun',_t('Sunday')]].map(o=>'<button data-ttday="'+o[0]+'"'+(o[0]===TTD?' style="outline:3px solid #ffc20e"':'')+'>'+o[1]+'</button>').join('')+_t('</div><p class="note">Paste the departure times (HH:MM) from go.bkk.hu for each stream of the selected day type. Streams left empty use simulated headways. Saved in this browser.</p>');
 const cur=IM()[TTD]||{};
 for(const x of STR())h+='<p><b>'+TTL(x)+'</b></p><textarea id="tt'+x[3]+'" rows="2" style="width:100%;font:inherit">'+(cur[x[3]]||[]).map(fmtHM).join(' ')+'</textarea>';
 $('ov').innerHTML=h+_t('<div class="jobs"><button data-ttsave="1">Save</button><button data-m="1">Back</button></div></div>');
}
function ttSave(){ttCollect();try{localStorage.setItem(KEY(),JSON.stringify(IM()))}catch(e){}menu()}
function depots(){
 $('ov').style.display='flex';
 let h=_t('<div class="box" style="max-height:85vh;overflow:auto"><h2>Depots</h2><p class="note">Every line takes its trams from the depots and types listed here. 9 depots are planned; all 9 are set up, but lines do not use the new ones yet.</p>');
 for(let i=0;i<9;i++){const d=DEPOTS[i];h+='<p><b>'+(i+1)+'. '+(d?d.name+_t(' depot'):_t('Not set up yet'))+'</b></p>';if(d)for(const f of d.fleet){const ls=Object.keys(RULES).filter(l=>RULES[l].some(([dn,ty])=>dn===d.name&&ty===f.type)).join(', ');h+='<p class="note"><b>'+f.type+'</b> · '+f.cars.length+_t(' cars · lines ')+(ls||_t('none'))+'<br>'+crange(f.cars)+'</p>'}if(d&&d.special)for(const sp of d.special)h+='<p class="note"><b>'+sp.type+'</b> · '+sp.label+'<br>'+sp.note+'</p>'}
 $('ov').innerHTML=h+_t('<div class="jobs"><button data-mm="1">Back to main menu</button></div></div>');
}
function step(dt){
 now+=dt*SPD;
 for(const e of evs)if(e.kind==='trn'&&e.stage==='pending'&&now>=e.at){trnAuto(e)}
 for(const m of tms){
  if(m.s==='sched'&&now>=m.arr-SIG[0]*INp[m.g].L/M.v){m.s='in';m.d=0}
  if(m.s==='in'&&now>=m.arr){
   if(waiting(m.g).length>=3){m.s='gone';strikes++;log((H?'Megtelt a jelző: a #'+m.id+' villamost elutasították'+(gOf(m.g).sn?' ('+gOf(m.g).sn+' jelző)':'')+'. Panasz!':'Signal full: tram #'+m.id+' turned away'+(gOf(m.g).sn?' at the '+gOf(m.g).sn+' signal':'')+'. Complaint!'))}
   else{m.s='wait';m.tw=now;if(m.brk&&m.ev){m.ev.stage='active';m.brkT=now;log(_t('⚠ Tram ')+m.ln+' #'+m.id+_t(' arrived broken down: ')+(m.brk.kind==='move'?_t('it can still move.'):_t('it cannot move.')))}}}
  if(m.s==='exit'&&now-m.tx>=XTp[m.trk][m.xg||m.g].L/M.v){m.s='out';if(m.ev&&m.brk&&m.ev.stage==='active'){if(m.her)herRepl(m);else{m.ev.stage='replace';log((H?'A #'+m.id+' villamos beért a kocsiszínbe. Válassz pótvillamost.':'Tram #'+m.id+' reached the depot. Choose a replacement tram.'))}}}
  if(m.wb&&m.wb.how==='platform'&&m.s==='plat'&&!m.brk&&now>=m.t0+m.ed+m.wb.off){m.brk={kind:m.wb.kind};m.noscore=true;m.brkT=now;m.ev.stage='active';log(_t('⚠ Tram ')+m.ln+' #'+m.id+_t(' broke down on track ')+PL[m.trk].n+_t(' while passengers were changing: ')+(m.brk.kind==='move'?_t('it can still move.'):_t('it cannot move.')))}
  if(m.brk&&m.brk.kind==='tow'&&m.s==='plat'&&!trk[m.trk].helper){const al=[PL[m.trk].g,...Object.keys(PL[m.trk].alt||{})];if(!tms.some(x=>x!==m&&!x.her&&['sched','in','wait'].includes(x.s)&&al.includes(x.g))){m.brk.kind='move';log(_t('No tram left to couple with: #')+m.id+_t(' turns out to be able to move slowly.'))}}
  if(m.brk&&m.brkT&&!m.cmp&&(m.s==='plat'||m.s==='wait')&&now-m.brkT>600){m.cmp=true;strikes++;log(_t('Passenger complaint: the broken tram has not been cleared!'))}
  if(m.ev&&m.ev.stage==='pending'&&m.s==='gone')m.ev.stage='cancel';
 }
 mapUpdate(dt*SPD);check();
 acc+=dt;if(acc>.25){acc=0;draw()}
}
function mapUpdate(gd){
 for(const m of tms){
  let p=null;
  if(m.s==='in'||m.s==='wait'){const L=INp[m.g].L,idx=m.s==='wait'?waiting(m.g).indexOf(m):waiting(m.g).length+tms.filter(x=>x.s==='in'&&x.g===m.g&&x.arr<m.arr).length,tg=SIG[Math.min(2,idx)]*L;m.d=Math.min(tg,(m.d||0)+M.v*gd);p=at(INp[m.g],m.d/L)}
  else if(m.s==='plat')p=at(m.ep,Math.min(1,(now-m.t0)/m.ed));
  else if(m.s==='help')p=at(m.ep,Math.min(.88,M.v*(now-m.t0)/m.ep.L));
  else if(m.s==='exit')p=at(XTp[m.trk][m.xg||m.g],(now-m.tx)*M.v/XTp[m.trk][m.xg||m.g].L+(m.lead||0));
  if(!p){m.el.style.display='none';continue}
  m.el.setAttribute('transform','translate('+p[0]+' '+p[1]+')');m.el.style.display='';const cc=m.el.firstChild;if(cc)cc.setAttribute('fill',m.brk?'#e03b3b':m.trn?'#d6332f':m.her?'#f28c28':'#ffc20e');
 }
 for(const g of GR){const s=$('sg'+g.k);if(s)s.setAttribute('fill',now<jb[g.k]?'var(--red)':'var(--grn)')}
}
const qh=g=>{const q=waiting(g.k);return q.length?q.map(m=>'<button class="tram'+(sel===m.id?' sel':'')+'" data-w="'+m.id+'"'+(m.her?' style="background:#f28c28"':'')+'><b class="ln"'+(m.trn?' style="background:#d6332f;color:#fff"':m.her?' style="color:#f28c28"':'')+'>'+m.ln+'</b><span>#'+m.id+' → '+(m.trn?_t('turns back (training run)'):m.dep?(m.her?(M.id==='kvh'?'Jászai Mari tér':'Közvágóhíd H'):typeof g.dst==='object'?g.dst[m.ln]:g.dst):_t('depot'))+'<small>'+CAR[m.id].type+' · '+CAR[m.id].depot+_t(' depot</small>')+(m.brk?_t('<small style="color:#e03b3b">⚠ BROKEN DOWN: ')+(m.brk.kind==='move'?_t('can still move'):_t('cannot move'))+'</small>':'')+(m.trn?_t('<small>Tanulójárat (driver trainer)</small>'):'')+(m.trn?_t('<small>turns 3 min after entering a track · waiting ')+mmss(now-m.tw)+'</small>':_t('<small>due ')+fmt(m.due)+_t(' · waiting ')+mmss(now-m.tw)+'</small>')+'</span></button>').join(''):_t('<span class="note">No trams waiting at this signal.</span>')};
const th=i=>{const t=trk[i],nm=_t('<span class="nm">Track ')+PL[i].n+'</span>';
 if(t.tram&&t.tram.brk){const m=t.tram,h=t.helper,k=m.brk.kind==='move';return '<div class="trk occ" data-t="'+i+'" style="border-color:#e03b3b">'+nm+'<b class="tram" style="padding:2px 8px;background:#e03b3b;color:#fff">'+m.ln+' #'+m.id+'</b><small>'+CAR[m.id].type+_t('</small><span>⚠ Broken down: ')+(k?_t('can still move. Tap to send it to the depot.'):h?(now<h.rdy?_t('coupling #')+h.id+'…':_t('coupled with #')+h.id+_t('. Tap to tow both to the depot.')):_t('cannot move. Select a waiting tram, then tap here to couple it.'))+'</span></div>'}
 if(t.tram){const m=t.tram,r=now>=m.rdy,early=now<m.due-45,pr=Math.min(100,100*(1-(m.rdy-now)/(m.rdy-m.t0)));
  return '<div class="trk occ'+(r&&!early?' rdy':'')+'" data-t="'+i+'"'+(m.her?' style="background:#f28c28"':'')+'>'+nm+'<b class="tram" style="padding:2px 8px'+(m.trn?';background:#d6332f;color:#fff':m.her?';background:#f28c28':'')+'">'+m.ln+' #'+m.id+'</b><small>'+CAR[m.id].type+'</small>'+(!r?'<div class="bar"><i style="width:'+pr+_t('%"></i></div><small>unloading</small>'):early?_t('<span>Unloaded. Due ')+fmt(m.due)+_t(' (leaving now is early)</span>'):_t('<span>Ready. Tap to depart · due ')+fmt(m.due)+'</span>')+'</div>'}
 return '<div class="trk" data-t="'+i+'">'+nm+'<span class="note" style="margin:0">'+PL[i].free+'</span></div>'};
function draw(){
 if(!J)return;
 $('sc').textContent=fmt(now);$('ss').textContent=score;$('st').textContent=strikes+'/3';$('sd').textContent=done+'/'+tms.filter(m=>!m.noscore).length;$('evp').innerHTML=evHtml();
 $('jn').textContent=GR.map(g=>g.jl+(now<jb[g.k]?_t(' occupied for ')+Math.ceil(jb[g.k]-now)+_t(' s'):_t(' clear'))).join(' · ')+'.';
 for(const g of GR){
  $('q'+g.k).innerHTML=qh(g);
  const inb=tms.filter(m=>m.s==='in'&&m.g===g.k).length,nx=tms.find(m=>m.s==='sched'&&m.g===g.k);
  $('ap'+g.k).textContent=inb?(H?inb+' villamos közeledik.':inb+' tram'+(inb>1?'s':'')+' approaching.'):(nx?_t('Next tram expected around ')+fmt(nx.arr)+'.':_t('No more trams to come.'));
  $('tk'+g.k).innerHTML=g.order.map(th).join('');
 }
 $('lg').innerHTML=logs.map(l=>'<div>'+l+'</div>').join('');
}
function loop(ts){if(run)step(Math.min(.1,(ts-last)/1000));last=ts;requestAnimationFrame(loop)}
document.addEventListener('pointerdown',e=>{
 if(!run||$('ov').style.display==='flex')return;
 const rp=e.target.closest('[data-rep]');if(rp){repl(rp.dataset.rep);draw();return}
 const tp=e.target.closest('[data-trn]');if(tp){trnPick(tp.dataset.trn);draw();return}
 const w=e.target.closest('[data-w]'),t=e.target.closest('[data-t]');
 if(w){const wm=tms.find(m=>String(m.id)===w.dataset.w),wid=wm?wm.id:null;sel=sel===wid?null:wid;draw()}else if(t){act(+t.dataset.t);draw()}
});
$('ov').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.dep)depots();
 else if(b.dataset.go)goShift();
 else if(b.dataset.rp)start(lastO);
 else if(b.dataset.tt)ttScreen();
 else if(b.dataset.ttsave)ttSave();
 else if(b.dataset.ttday){ttCollect();ttScreen(b.dataset.ttday)}
 else if(b.dataset.map){setMap(b.dataset.map);menu()}
 else if(b.dataset.mm)home();
 else if(b.dataset.m)menu();
 else if(b.dataset.r){$('ov').style.display='none';run=true;$('pb').textContent=_t('Pause')}
});
$('ov').addEventListener('input',()=>{const d=$('dd'),n=$('dn');if(d&&n)n.textContent=dayNote(d.value)});
$('pb').onclick=()=>{if(!J||over)return;run=!run;$('pb').textContent=run?_t('Pause'):_t('Resume')};
$('sp').onclick=()=>{SPD=SPD>=30?10:SPD+10;$('sp').textContent=_t('Speed ')+(SPD/10)+'×'};
$('mb').onclick=menu;$('hb').onclick=home;
setMap('kvh');home();requestAnimationFrame(loop);
</script>
<script>
/* ===== Loader =====
   The whole game lives in the text/plain block above (id="gamecode"), so it does not run by itself.
   After the player picks a language: store it in window.LANG, translate the static page texts, then inject and run the game code. */
const STAT={hu:{title:'Budapesti villamosdiszpécser',h1:'Villamosdiszpécser',hb:'Térképek',sp:'Sebesség 1×',pb:'Szünet',mb:'Dátum és idő',st:['Idő','Pontszám','Panaszok','Elindult'],lang:'hu'}};
document.getElementById('lp').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  window.LANG=b.dataset.l;                                   /* remember the choice for this session only */
  const S=STAT[window.LANG];
  if(S){                                                     /* Hungarian: translate the static markup */
    document.documentElement.lang=S.lang;document.title=S.title;
    document.querySelector('h1').textContent=S.h1;
    for(const id of['hb','sp','pb','mb'])document.getElementById(id).textContent=S[id];
    document.querySelectorAll('.stats small').forEach((el,i)=>el.textContent=S.st[i]);
  }
  document.getElementById('lp').style.display='none';
  const s=document.createElement('script');                  /* run the game code now that LANG is known */
  s.textContent=document.getElementById('gamecode').textContent;
  document.body.appendChild(s);
});
/* Changing language later restarts the game (the picker appears again on reload); imported timetables are kept in localStorage. */
document.getElementById('lb').onclick=()=>location.reload();
</script></body></html>
